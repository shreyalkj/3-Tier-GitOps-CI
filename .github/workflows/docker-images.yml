
name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # JOB 1: NODE.JS COMPILATION
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend Compilation
        run: |
          cd client
          find . -name "*.js" -exec node --check {} +

      - name: Backend Compilation
        run: |
          cd api
          find . -name "*.js" -exec node --check {} +

  # JOB 2: GITLEAKS SECRET SCANNING
  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks Setup
        uses: gitleaks/gitleaks-action@v2

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1

  # JOB 3: TRIVY FILESYSTEM SCANNING
  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # JOB 4: BUILD BACKEND DOCKER IMAGE
  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            adijaiswal/backend:latest
            adijaiswal/backend:${{ env.IMAGE_TAG }}

  # JOB 5: BUILD FRONTEND DOCKER IMAGE
  build_frontend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            adijaiswal/frontend:latest
            adijaiswal/frontend:${{ env.IMAGE_TAG }}

  # JOB 6: TRIVY DOCKER IMAGE SCANNING
  trivy_image_scan:
    runs-on: ubuntu-latest
    needs:
      - build_backend_docker_image_and_push
      - build_frontend_docker_image_and_push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: adijaiswal/backend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: adijaiswal/frontend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # JOB 7: UPDATE GITOPS CD REPOSITORY
  update_cd_repo:
    runs-on: ubuntu-latest
    needs: trivy_image_scan

    steps:
      - name: Checkout CD Repository
        uses: actions/checkout@v4
        with:
          repository: jaiswaladi246/3-Tier-GitOps-CD
          ref: main
          token: ${{ secrets.CD_REPO_TOKEN }}
          path: cd

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o yq
          sudo install yq /usr/local/bin/yq

      - name: Update Backend and Frontend Image Tags
        working-directory: cd
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |

          # Remove accidental template fields from Service manifests
          yq -i '(. | select(.kind == "Service")) |= del(.spec.template)' k8s-prod/backend.yaml
          yq -i '(. | select(.kind == "Service")) |= del(.spec.template)' k8s-prod/frontend.yaml

          # Update Backend Deployment image
          yq -i '
            (. | select(.kind == "Deployment")
            | .spec.template.spec.containers[]
            | select(.name == "backend")
            | .image) = "adijaiswal/backend:" + strenv(IMAGE_TAG)
          ' k8s-prod/backend.yaml

          # Update Frontend Deployment image
          yq -i '
            (. | select(.kind == "Deployment")
            | .spec.template.spec.containers[]
            | select(.name == "frontend")
            | .image) = "adijaiswal/frontend:" + strenv(IMAGE_TAG)
          ' k8s-prod/frontend.yaml

      - name: Commit and Push Changes
        working-directory: cd
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git add k8s-prod/backend.yaml k8s-prod/frontend.yaml

          git commit -m "bump images to ${IMAGE_TAG}" || echo "No changes to commit"

          git push origin main
